<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Recomendaciones de juegos de Steam con un modelo de dos torres y explicaciones de un LLM."
    />
    <title>Recomendador de juegos de Steam</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/" data-nav>🎮 Recomendador de juegos de Steam</a>
      <form id="user-form" role="search">
        <input
          name="user"
          inputmode="numeric"
          placeholder="ID de usuario de Steam"
          aria-label="ID de usuario de Steam"
        />
        <button type="submit">Ver recomendaciones</button>
      </form>
    </header>
    <main id="main"></main>
    <dialog id="details"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
