<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Steam game recommendations from a two-tower model with LLM explanations."
    />
    <title>Steam Game Recs</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/" data-nav>🎮 Steam Game Recs</a>
      <form id="user-form" role="search">
        <input
          name="user"
          inputmode="numeric"
          placeholder="Steam user id"
          aria-label="Steam user id"
        />
        <button type="submit">Show recs</button>
      </form>
    </header>
    <main id="main"></main>
    <dialog id="details"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
