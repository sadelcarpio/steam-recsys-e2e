[project]
name = "steam-etl"
version = "0.1.0"
description = "dbt + Athena transformations: raw Steam parquet -> Iceberg feature tables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "dbt-athena>=1.9",
    "dbt-core>=1.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_etl"]

[dependency-groups]
dev = [
    "moto[ssm]>=5.0",
    "pyarrow>=17",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# dbt's bundled macros contain regex escapes that jinja2 warns about.
filterwarnings = ["ignore::DeprecationWarning:jinja2.*"]
markers = [
    "athena: runs the dbt project on real Athena (needs ETL_CI_* env vars and AWS credentials)",
]
