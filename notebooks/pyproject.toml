[project]
name = "steam-eda"
version = "0.1.0"
description = "EDA notebooks + data loading helpers over the Iceberg marts and the raw scraped parquet"
readme = "README.md"
authors = [
    { name = "sadelcarpio", email = "sadelcarpioa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "polars>=1.30",
    "pyarrow>=18",
    "pydantic-settings>=2.6",
    "pyiceberg[glue,pyarrow]>=0.10",
    "seaborn>=0.13",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# one shared setup cell imports every helper; exploratory cells may run long
"*.ipynb" = ["F401", "E501", "E702"]
