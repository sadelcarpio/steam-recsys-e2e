name: data-ingestion CD

# Deploy (on merges to main through cd.yml, or manual) of the scraping image (ECR `data-ingestion`) and the
# `list-partition-game-ids` Lambda code. Infrastructure must be applied first.
#
# The scraping image is multi-arch (linux/amd64 + linux/arm64, spec 14): each architecture is
# built natively on its own runner (no QEMU) by the ungated `build` jobs and handed over as an
# artifact, so `deploy` is the only job in `prod` (one approval). It pushes `<sha>-amd64` and
# `<sha>-arm64`, then the index `<sha>` + `latest` over both: task definitions of either
# architecture pull the same tag.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, scraping-image, lambda]
        default: all
  workflow_call: # cd.yml, on merges to main
    inputs:
      target:
        type: string
        default: all

permissions:
  id-token: write
  contents: read

concurrency:
  group: data-ingestion-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: data_ingestion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra scraping && uv run pytest -q

  build:
    needs: test
    if: inputs.target != 'lambda'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build scraping image (${{ matrix.arch }})
        run: |
          docker build -f scraping.Dockerfile -t "data-ingestion:${{ matrix.arch }}" .
          docker run --rm "data-ingestion:${{ matrix.arch }}" python -c \
            "import platform, steam_ingestion.games_scraping, steam_ingestion.reviews_scraping, steam_ingestion.tags_scraping; print(platform.machine())"
          docker save -o "${RUNNER_TEMP}/image-${{ matrix.arch }}.tar" "data-ingestion:${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: scraping-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 1

  deploy:
    needs: [test, build]
    # build is skipped for target=lambda
    if: >-
      !cancelled() && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/pipeline-guard

      - name: Log in to ECR
        if: inputs.target != 'lambda'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/download-artifact@v4
        if: inputs.target != 'lambda'
        with:
          pattern: scraping-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Push the multi-arch scraping image
        if: inputs.target != 'lambda'
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/data-ingestion
        run: |
          for arch in amd64 arm64; do
            docker load -i "${RUNNER_TEMP}/images/image-${arch}.tar"
            docker tag "data-ingestion:${arch}" "$REPO:${GITHUB_SHA}-${arch}"
            docker push "$REPO:${GITHUB_SHA}-${arch}"
          done
          docker buildx imagetools create -t "$REPO:${GITHUB_SHA}" -t "$REPO:latest" \
            "$REPO:${GITHUB_SHA}-amd64" "$REPO:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$REPO:latest"

      - name: Deploy Lambda code
        if: inputs.target != 'scraping-image'
        run: |
          zip_path="$(scripts/build_lambda.sh)"
          aws lambda update-function-code \
            --function-name list-partition-game-ids \
            --zip-file "fileb://${zip_path}" --publish > /dev/null
          aws lambda wait function-updated-v2 --function-name list-partition-game-ids
