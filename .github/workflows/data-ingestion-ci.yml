name: data-ingestion CI

on:
  # Called by ci.yml on PRs that change this component (paths listed there). No push trigger:
  # the required check needs branches up to date, so `main` is tested as merged.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: data_ingestion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: data_ingestion/uv.lock
      - run: uv sync --frozen --extra scraping
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build scraping image
        run: docker build -f scraping.Dockerfile -t data-ingestion:ci .
      - name: Build Lambda zip
        run: scripts/build_lambda.sh
