name: data-ingestion CI

on:
  # Called by ci.yml on PRs that change this component (paths listed there). No push trigger:
  # the required check needs branches up to date, so `main` is tested as merged.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: data_ingestion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: data_ingestion/uv.lock
      - run: uv sync --frozen --extra scraping
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The scraping image is multi-arch (spec 14: ARM64 Fargate tasks): build and smoke-test it
  # natively on both architectures, as the CD does.
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build scraping image
        run: docker build -f scraping.Dockerfile -t data-ingestion:ci .
      - name: Import the scrapers in the image
        run: >-
          docker run --rm data-ingestion:ci python -c
          "import platform, steam_ingestion.games_scraping, steam_ingestion.reviews_scraping,
          steam_ingestion.tags_scraping; print(platform.machine())"
      - name: Build Lambda zip
        if: matrix.runner == 'ubuntu-latest'
        run: scripts/build_lambda.sh
