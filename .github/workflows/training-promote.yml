name: training promote

# Manual: evaluates a trained model against the current champion on the same validation rows
# (after both training cutoffs) in a SageMaker job, then writes evaluation/<retriever_id>/metrics.json;
# when the candidate beats the champion (and the popularity baseline) on warm recall@PRIMARY_K,
# copies it to models/champion/ and evaluation/champion/metrics.json.
#
# Two ids, often but not always the same string:
#   retriever_id = the retriever's folder, s3://model-artifacts-<acct>/models/<retriever_id>/
#   image_tag    = the code that evaluates it, ECR training:<image_tag>
# A model from *training CD* is named after its commit sha, and that commit's image has the
# same tag, so both inputs can stay empty (= the commit this workflow runs on) or be that sha.
# A model trained locally is named local-<short sha>-<suffix> and has no image of its own:
# set image_tag to a pushed image that can load it, e.g. the merge commit sha that contains
# its code (*training image CD* pushes training:<merge sha>).
#
# mode (spec 9):
#   retriever  the above (refused once a ranker serves: a retriever must then go through `pair`)
#   pair       evaluates the serving (retriever, ranker) pair against challenger pairs built from
#              retriever_id (a new retriever, optional) and ranker_id (a ranker from *training
#              rank*, optional) on groups none of them trained on, promotes the best one and
#              writes evaluation/champion/pair.json + history.jsonl
#   rollback   restores the pair that served before the current one (run inference afterwards)
on:
  workflow_dispatch:
    inputs:
      # No real default: a run left on `choose` fails before anything starts (an empty
      # retriever_id in retriever mode would otherwise promote this commit's sha as a retriever).
      mode:
        description: "retriever (a retriever alone), pair (retriever and / or ranker), rollback"
        type: choice
        required: true
        options: [choose, retriever, pair, rollback]
        default: choose
      ranker_id:
        description: "pair: challenger ranker, rankers/<ranker_id>/ (empty = none)"
        type: string
        default: ""
      retriever_id:
        description: "Retriever = folder models/<retriever_id>/ in the bucket: the commit sha for training CD models, local-<sha>-<suffix> for local ones (retriever mode: empty = this commit's sha; pair mode: empty = keep the serving retriever)"
        type: string
        default: ""
      image_tag:
        description: "Image tag in ECR training:<tag> that runs the evaluation (empty = retriever_id, right for training CD models; for local-… models: a merge commit sha that has an image)"
        type: string
        default: ""
      env_overrides:
        description: "Evaluation overrides, space-separated NAME=value (e.g. PRIMARY_K=100 MIN_IMPROVEMENT=0.005)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: training-promote
  cancel-in-progress: false

defaults:
  run:
    working-directory: training

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 75
    env:
      USE_SSM: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Require a mode
        if: inputs.mode == 'choose'
        working-directory: .
        run: |
          echo "::error::pick a mode: retriever, pair or rollback"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock
      - run: uv sync --frozen --no-group cu128 --group cpu

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/pipeline-guard

      - name: Evaluate and promote a retriever on SageMaker
        if: inputs.mode == 'retriever'
        env:
          MODEL_ID: ${{ inputs.retriever_id || github.sha }}
          OVERRIDES: ${{ inputs.env_overrides }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          uv run --no-sync python -m steam_training.launch promote --model-id "$MODEL_ID" \
            ${IMAGE_TAG:+--image-tag "$IMAGE_TAG"} --env "$OVERRIDES" --summary "$GITHUB_STEP_SUMMARY"

      # pair / rollback: the job runs this commit's image (or image_tag); --model-id only names it
      - name: Evaluate and promote a pair, or roll back, on SageMaker
        if: inputs.mode != 'retriever'
        env:
          MODE: ${{ inputs.mode }}
          RETRIEVER: ${{ inputs.retriever_id }}
          RANKER: ${{ inputs.ranker_id }}
          OVERRIDES: ${{ inputs.env_overrides }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          if [ "$MODE" = rollback ]; then
            ENV="ROLLBACK=true"; LABEL=rollback
          else
            ENV="${RETRIEVER:+RETRIEVER_ID=$RETRIEVER} ${RANKER:+RANKER_ID=$RANKER}"
            LABEL="${RANKER:-$RETRIEVER}"
            if [ -z "$LABEL" ]; then echo "pair needs retriever_id and / or ranker_id" >&2; exit 1; fi
          fi
          uv run --no-sync python -m steam_training.launch pair --model-id "$LABEL" \
            --image-tag "$IMAGE_TAG" --env "$ENV $OVERRIDES" --summary "$GITHUB_STEP_SUMMARY"
