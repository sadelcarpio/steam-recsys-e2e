name: training promote

# Manual: evaluates a trained model against the current champion on the same validation rows
# (after both training cutoffs) in a SageMaker job, then writes evaluation/<model_id>/metrics.json;
# when the candidate beats the champion (and the popularity baseline) on warm recall@PRIMARY_K,
# copies it to models/champion/ and evaluation/champion/metrics.json.
#
# Two ids, often but not always the same string:
#   model_id  = the model's folder, s3://model-artifacts-<acct>/models/<model_id>/
#   image_tag = the code that evaluates it, ECR training:<image_tag>
# A model from *training CD* is named after its commit sha, and that commit's image has the
# same tag, so both inputs can stay empty (= the commit this workflow runs on) or be that sha.
# A model trained locally is named local-<short sha>-<suffix> and has no image of its own:
# set image_tag to a pushed image that can load it, e.g. the merge commit sha that contains
# its code (*training image CD* pushes training:<merge sha>).
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model id = folder models/<model_id>/ in the bucket: the commit sha for training CD models, local-<sha>-<suffix> for local ones (empty = this commit's sha)"
        type: string
        default: ""
      image_tag:
        description: "Image tag in ECR training:<tag> that runs the evaluation (empty = model_id, right for training CD models; for local-… models: a merge commit sha that has an image)"
        type: string
        default: ""
      env_overrides:
        description: "Evaluation overrides, space-separated NAME=value (e.g. PRIMARY_K=100 MIN_IMPROVEMENT=0.005)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: training-promote
  cancel-in-progress: false

defaults:
  run:
    working-directory: training

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 75
    env:
      USE_SSM: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock
      - run: uv sync --frozen --extra cpu

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/pipeline-guard

      - name: Evaluate and promote on SageMaker
        env:
          MODEL_ID: ${{ inputs.model_id || github.sha }}
          OVERRIDES: ${{ inputs.env_overrides }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          uv run python -m steam_training.launch promote --model-id "$MODEL_ID" \
            ${IMAGE_TAG:+--image-tag "$IMAGE_TAG"} --env "$OVERRIDES" --summary "$GITHUB_STEP_SUMMARY"
