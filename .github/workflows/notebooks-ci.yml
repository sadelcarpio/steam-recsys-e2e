name: notebooks CI

on:
  # Called by ci.yml on PRs that change this component (paths listed there).
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: notebooks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: notebooks/uv.lock
      # default groups only (dev): the nlp group (torch) is not needed, the notebook test runs
      # with EDA_TEXT_MODELS=lexical on a synthetic dataset
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
