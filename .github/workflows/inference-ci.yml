name: inference CI

# inference imports the training package (model, artifact contract, catalog code), and its
# contract test reads the written items with the serving package, so changes to either run this
# (ci.yml's `inference` pattern).
on:
  # Called by ci.yml on PRs that change this component (paths listed there). No push trigger:
  # the required check needs branches up to date, so `main` is tested as merged.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: inference

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: inference/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit tests + full runs on synthetic marts (moto S3 + DynamoDB, fake LLM), no AWS.
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Context = repository root (the image includes the training package).
      - name: Build inference image
        working-directory: .
        run: docker build -f inference/Dockerfile -t inference:ci .
