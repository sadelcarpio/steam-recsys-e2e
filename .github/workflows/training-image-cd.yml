name: training image CD

# Build and push of the training images on merges to main that change the training code (through
# cd.yml), or manual: CPU `training:<sha>` (+ `:latest`) and GPU `training:<sha>-cu128` (+
# `:latest-cu128`), in parallel jobs (each build gets a runner's own disk). No SageMaker job:
# training and promotion stay manual (*training CD*, *training promote*) or go through the
# training Step Function, whose GPU retriever runs `:latest-cu128` by default. Every merged
# commit gets both images, so a model trained locally (`local-…`) is promoted with
# `image_tag=<merge sha>`. ECR keeps the last 30 images (two per merge,
# `infrastructure/training.tf`).
on:
  workflow_dispatch:
  workflow_call: # cd.yml, on merges to main

permissions:
  id-token: write
  contents: read

concurrency:
  group: training-image-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: training

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock
      - run: uv sync --frozen --no-group cu128 --group cpu && uv run --no-sync pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      matrix:
        variant: [cpu, cu128]
    steps:
      - uses: actions/checkout@v4

      # The CUDA image needs more than the runner's free disk with the preinstalled toolchains
      - name: Free disk space
        if: matrix.variant == 'cu128'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Same builds as *training CD*: cpu -> <sha> + latest (promote and later runs),
      # cu128 -> <sha>-cu128 + latest-cu128 (GPU retriever jobs, the training Step Function)
      - name: Build and push training image
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/training
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = cpu ]; then TAG="$GITHUB_SHA"; LATEST=latest
          else TAG="$GITHUB_SHA-$VARIANT"; LATEST="latest-$VARIANT"; fi
          docker build --build-arg TORCH_VARIANT="$VARIANT" -t "$REPO:$TAG" -t "$REPO:$LATEST" .
          docker push "$REPO:$TAG"
          docker push "$REPO:$LATEST"
          echo "Pushed \`training:$TAG\` (+ \`:$LATEST\`)" >> "$GITHUB_STEP_SUMMARY"
