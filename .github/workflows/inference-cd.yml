name: inference CD

# Manual: tests, then pushes `inference:<sha>` and `inference:latest` to ECR. The pipeline's
# last step (`Infer`, a SageMaker Processing job) runs `:latest`. Optionally runs that job once
# right away (e.g. after a promotion) instead of waiting for the weekly pipeline. Infrastructure
# must be applied first.
on:
  workflow_dispatch:
    inputs:
      run_now:
        description: "Run the inference job once after deploying"
        type: boolean
        default: false
      env_overrides:
        description: "run_now only: container overrides, space-separated NAME=value (e.g. RERANK_ENABLED=false)"
        type: string
        default: ""
      wait_minutes:
        description: "run_now only: minutes to watch the job (the deploy role's credentials last 1 h)"
        type: number
        default: 45

permissions:
  id-token: write
  contents: read

concurrency:
  group: inference-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: inference

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: inference/uv.lock
      - run: uv sync --frozen && uv run pytest -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push inference image
        working-directory: .
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/inference
        run: |
          docker build -f inference/Dockerfile -t "$REPO:${GITHUB_SHA}" -t "$REPO:latest" .
          docker push "$REPO:${GITHUB_SHA}"
          docker push "$REPO:latest"

      # Same job as the pipeline's Infer state (request read from the state machine definition).
      - name: Run inference job
        if: inputs.run_now
        env:
          OVERRIDES: ${{ inputs.env_overrides }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          SFN="arn:aws:states:${AWS_REGION}:${ACCOUNT}:stateMachine:steam-recsys-pipeline"
          JOB="steam-recsys-infer-cd-$(date -u +%Y%m%d%H%M%S)"
          ENV_JSON=$(printf '%s\n' $OVERRIDES | jq -R 'select(length > 0) | split("=")
            | {(.[0]): (.[1:] | join("="))}' | jq -sc 'add // {}')
          aws stepfunctions describe-state-machine --state-machine-arn "$SFN" \
            --query definition --output text \
            | jq --arg name "$JOB" --argjson env "$ENV_JSON" '.States.Infer.Parameters
                | del(."ProcessingJobName.$") | .ProcessingJobName = $name
                | .Environment += $env' > job.json
          aws sagemaker create-processing-job --cli-input-json file://job.json > /dev/null
          echo "started $JOB"
          DEADLINE=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(aws sagemaker describe-processing-job --processing-job-name "$JOB" \
              --query ProcessingJobStatus --output text)
            case "$STATUS" in
              Completed|Failed|Stopped)
                REASON=$(aws sagemaker describe-processing-job --processing-job-name "$JOB" \
                  --query 'FailureReason || ExitMessage || `""`' --output text)
                echo "### inference job $JOB: $STATUS" >> "$GITHUB_STEP_SUMMARY"
                [ -n "$REASON" ] && echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
                echo "Logs: CloudWatch \`/aws/sagemaker/ProcessingJobs\`, stream prefix \`$JOB\`" >> "$GITHUB_STEP_SUMMARY"
                [ "$STATUS" = Completed ]
                exit
                ;;
            esac
            sleep 30
          done
          echo "### inference job $JOB still running after ${WAIT_MINUTES} min" >> "$GITHUB_STEP_SUMMARY"
