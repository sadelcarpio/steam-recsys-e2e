name: frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "infrastructure/cloudfront/**"
      - ".github/workflows/frontend-*.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infrastructure/cloudfront/**"
      - ".github/workflows/frontend-*.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # API client, search, cards, routing, and the CloudFront Functions. No AWS.
      - run: npm test
      - run: npm run build
