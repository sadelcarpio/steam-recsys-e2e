name: serving CI

on:
  # Called by ci.yml on PRs that change this component (paths listed there). No push trigger:
  # the required check needs branches up to date, so `main` is tested as merged.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: serving

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: serving/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Handler / routes / repository on moto DynamoDB, no AWS.
      - run: uv run pytest -q
      - name: Build the Lambda zip
        run: |
          zip_path="$(scripts/build_lambda.sh)"
          ls -l "$zip_path"
