name: infrastructure CD

# Manual plan/apply of infrastructure/ (bootstrap/ is applied locally, once).
on:
  workflow_dispatch:
    inputs:
      action:
        description: plan only, or plan + apply
        type: choice
        options: [plan, apply]
        default: plan
      serving_auth_type:
        description: >-
          Auth of the recsys-serving Function URL: AWS_IAM (SigV4-signed callers only; the
          frontend still works, CloudFront signs its calls) or NONE (URL public too). Every apply
          sets it, so pick NONE on each apply to keep it public.
        type: choice
        options: [AWS_IAM, NONE]
        default: AWS_IAM

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: infrastructure

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_serving_auth_type: ${{ inputs.serving_auth_type }}
      # Optional custom domain of the frontend (repository variables; unset = *.cloudfront.net)
      TF_VAR_frontend_domain_name: ${{ vars.FRONTEND_DOMAIN_NAME }}
      TF_VAR_frontend_certificate_arn: ${{ vars.FRONTEND_CERTIFICATE_ARN }}
      # Optional monthly cost alert (unset = no budget)
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -out=tfplan
      - if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
      - name: Outputs (values for the GitHub repository variables, see docs/deployment.md)
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Terraform outputs (serving auth: ${TF_VAR_serving_auth_type})"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
