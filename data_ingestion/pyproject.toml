[project]
name = "steam-ingestion"
version = "0.1.0"
description = "Incremental Steam games + reviews ingestion (Lambda partitioner and ECS scrapers)"
readme = "README.md"
requires-python = ">=3.12"
# Base deps are what the Lambda ships with; polars only goes into the ECS image.
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
]

[project.optional-dependencies]
scraping = ["polars>=1.20"]

[dependency-groups]
dev = [
    "moto[dynamodb,s3,secretsmanager,ssm]>=5.0",
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
