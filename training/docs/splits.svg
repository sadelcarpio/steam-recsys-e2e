<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Temporal splits: experiments, promotion and keeping a champion fresh</title>
  <defs>
    <pattern id="locked" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e4e4e4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a9a9a" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- header + time axis (bars: x 230 = oldest review, 880 = now, 880-950 = data that arrives later) -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Temporal splits (rows ordered by review time)</text>
  <text x="230" y="58" fill="#555">oldest review</text>
  <text x="880" y="58" fill="#555" text-anchor="middle">now</text>
  <text x="915" y="58" fill="#555" text-anchor="middle">later</text>
  <line x1="880" y1="64" x2="880" y2="745" stroke="#999" stroke-dasharray="4 4"/>

  <!-- legend -->
  <g transform="translate(560,18)">
    <rect width="14" height="14" fill="#4c78a8"/><text x="20" y="12" fill="#222">trained on</text>
    <rect x="105" width="14" height="14" fill="#f58518"/><text x="125" y="12" fill="#222">validation</text>
    <rect x="215" width="14" height="14" fill="#54a24b"/><text x="235" y="12" fill="#222">evaluated</text>
    <rect x="310" width="14" height="14" fill="#dedede"/><text x="330" y="12" fill="#222">never read</text>
  </g>

  <!-- 1. pick a recipe -->
  <text x="20" y="96" font-weight="bold" fill="#222">1. Pick a recipe</text>
  <text x="20" y="113" fill="#555">FIT_ON=train</text>
  <text x="20" y="129" fill="#555">ablations, epochs, HPs</text>
  <rect x="230" y="86" width="520" height="34" fill="#4c78a8"/>
  <text x="490" y="108" fill="#fff" text-anchor="middle">train (~85%)</text>
  <rect x="750" y="86" width="65" height="34" fill="#f58518"/>
  <text x="782" y="108" fill="#fff" text-anchor="middle">val</text>
  <rect x="815" y="86" width="65" height="34" fill="#dedede" stroke="#9a9a9a"/>
  <text x="847" y="108" fill="#333" text-anchor="middle">test</text>
  <text x="230" y="140" fill="#555">every candidate recipe (and its control) sees exactly the same rows; compare on validation</text>

  <!-- 2. confirm once -->
  <text x="20" y="186" font-weight="bold" fill="#222">2. Confirm the winner</text>
  <text x="20" y="203" fill="#555">FIT_ON=train+validation</text>
  <text x="20" y="219" fill="#555">once per recipe</text>
  <rect x="230" y="176" width="585" height="34" fill="#4c78a8"/>
  <text x="522" y="198" fill="#fff" text-anchor="middle">train + validation (~92.5%), epochs chosen in 1</text>
  <rect x="815" y="176" width="65" height="34" fill="#54a24b"/>
  <text x="847" y="198" fill="#fff" text-anchor="middle">test</text>
  <text x="230" y="230" fill="#555">the test number is the estimate you report; no per-epoch monitoring on it</text>

  <!-- 3. refit for serving -->
  <text x="20" y="276" font-weight="bold" fill="#222">3. Refit for serving</text>
  <text x="20" y="293" fill="#555">all rows (not built yet)</text>
  <rect x="230" y="266" width="650" height="34" fill="#4c78a8"/>
  <text x="555" y="288" fill="#fff" text-anchor="middle">everything up to now</text>
  <line x1="884" y1="283" x2="938" y2="283" stroke="#333" stroke-width="1.5"/>
  <polygon points="938,278 948,283 938,288" fill="#333"/>
  <text x="915" y="275" fill="#333" text-anchor="middle">serve</text>
  <text x="230" y="320" fill="#555">no rows left to score it on: trust step 2, or let step 4 judge it on the next ingest</text>

  <!-- 4. challenger vs serving champion -->
  <text x="20" y="366" font-weight="bold" fill="#222">4. Challenger vs the</text>
  <text x="20" y="383" font-weight="bold" fill="#222">serving champion</text>
  <text x="20" y="400" fill="#555">training promote</text>
    <rect x="230" y="362" width="440" height="24" fill="#4c78a8"/>
  <text x="240" y="379" fill="#fff">champion: trained until c1</text>
  <text x="676" y="379" fill="#555">c1 (months ago)</text>
    <rect x="230" y="394" width="585" height="24" fill="#4c78a8"/>
  <text x="240" y="411" fill="#fff">challenger: trained until c2 (newer data and/or new recipe)</text>
  <rect x="815" y="394" width="65" height="24" fill="#54a24b"/>
  <rect x="815" y="362" width="65" height="24" fill="#54a24b"/>
  <text x="847" y="436" fill="#333" text-anchor="middle">held-out</text>
  <text x="847" y="450" fill="#333" text-anchor="middle">newest weeks</text>
  <rect x="880" y="362" width="70" height="56" fill="none" stroke="#54a24b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="915" y="436" fill="#333" text-anchor="middle">or: next</text>
  <text x="915" y="450" fill="#333" text-anchor="middle">ingest</text>
  <text x="230" y="470" fill="#555">both models scored on rows after max(c1, c2), which neither saw; the challenger's fresher data is a real</text>
  <text x="230" y="486" fill="#555">advantage (drift, new games are OOV for the champion), so it counts. Guardrails: coverage, lift, collapse</text>

  <!-- 5. keep the champion fresh -->
  <text x="20" y="532" font-weight="bold" fill="#222">5. Keep a serving</text>
  <text x="20" y="549" font-weight="bold" fill="#222">champion fresh</text>
  <text x="20" y="566" fill="#555">same recipe, newer data</text>

    <rect x="230" y="528" width="585" height="24" fill="#4c78a8"/>
  <text x="240" y="545" fill="#fff">A. full retrain: everything up to the held-out weeks</text>
  <rect x="815" y="528" width="65" height="24" fill="#54a24b"/>
  <text x="230" y="572" fill="#555">monthly: all data with a fresh vocabulary (new games get embeddings), then step 4 vs the champion.</text>
  <text x="230" y="588" fill="#555">~16 min on the local GPU today, so this is the default</text>

    <rect x="230" y="610" width="440" height="24" fill="#dedede" stroke="#9a9a9a"/>
  <text x="240" y="627" fill="#333">B. incremental: already learned (champion weights)</text>
  <rect x="590" y="610" width="22" height="24" fill="#9ecae9"/>
  <rect x="630" y="610" width="22" height="24" fill="#9ecae9"/>
  <rect x="670" y="610" width="145" height="24" fill="#4c78a8"/>
  <text x="742" y="627" fill="#fff" text-anchor="middle">rows since c1</text>
  <rect x="815" y="610" width="65" height="24" fill="#54a24b"/>
  <text x="230" y="654" fill="#555">warm-start from the champion, fine-tune on the new rows plus a replay sample of older ones (light blue) so it</text>
  <text x="230" y="670" fill="#555">doesn't forget; grow the game / developer / tag tables for ids newer than its vocabulary. Not supported yet:</text>
  <text x="230" y="686" fill="#555">vocab sizes are fixed per model, and checkpoints resume only an identical run (same fingerprint).</text>
  <text x="230" y="702" fill="#555">Worth it when full retrains get slow or must run weekly; still judged by step 4.</text>
  <text x="20" y="740" fill="#888" font-size="12">Fractions (TEST_FRACTION, VALIDATION_FRACTION) are row shares, so the windows move with the data. Promotion always evaluates after both cutoffs.</text>
</svg>
